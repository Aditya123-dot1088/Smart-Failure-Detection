services:
  # Backend API
  - type: web
    name: project-intake-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run migrate && npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 4000

      - key: CORS_ORIGIN
        fromService:
          name: project-intake-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: DATABASE_URL
        fromDatabase:
          name: project-intake-db
          property: connectionString

      - key: GEMINI_API_KEY
        sync: false

  # Frontend
  - type: web
    name: project-intake-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        fromService:
          name: project-intake-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: project-intake-db
    databaseName: project_intake